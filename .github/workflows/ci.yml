name: Lumi CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: API (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumi_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lumi_db?schema=public
      JWT_SECRET: ci-test-jwt-secret-key-minimum-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint (strict check without --fix)
        run: npm run lint:check

      - name: Run TypeScript Typecheck (strict, including tests)
        run: npm run typecheck

      - name: Run Unit Tests (Jest)
        run: npm test

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Build NestJS API
        run: npm run build

  frontend-ci:
    name: Web (Lint, Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
