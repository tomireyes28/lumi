name: Lumi CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: API (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumi_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lumi_db?schema=public
      JWT_SECRET: ci-test-jwt-secret-key-minimum-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check canonical HTTP contracts
        run: node ../scripts/sync-contracts.cjs --check

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint (strict check without --fix)
        run: npm run lint:check

      - name: Run TypeScript Typecheck (strict, including tests)
        run: npm run typecheck

      - name: Run Unit Tests (Jest)
        run: npm test

      - name: Verify business calendar in UTC and Buenos Aires
        run: npm run test:dates

      - name: Run HTTP tests (mocked Prisma)
        run: npm run test:e2e

      - name: Build NestJS API
        run: npm run build

  database-ci:
    name: PostgreSQL ${{ matrix.postgres }} (Fresh install & Upgrade)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '17']
        include:
          - postgres: '16'
            timezone: UTC
          - postgres: '17'
            timezone: America/Argentina/Buenos_Aires
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: lumi_test
          POSTGRES_PASSWORD: lumi_test_ci_only
          POSTGRES_DB: lumi_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumi_test -d lumi_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./api
    env:
      TEST_DATABASE_URL: postgresql://lumi_test:lumi_test_ci_only@127.0.0.1:5432/lumi_test_admin
      TZ: ${{ matrix.timezone }}
      DATABASE_URL: postgresql://lumi_test:lumi_test_ci_only@127.0.0.1:5432/lumi_test_admin
      DIRECT_URL: postgresql://lumi_test:lumi_test_ci_only@127.0.0.1:5432/lumi_test_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Test migrations and Prisma against real PostgreSQL
        run: npm run test:integration
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}

  frontend-ci:
    name: Web (Lint, Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check canonical HTTP contracts
        run: node ../scripts/sync-contracts.cjs --check

      - name: Run ESLint
        run: npm run lint

      - name: Test HttpOnly session boundary and CSRF
        run: npm run test:unit

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

      - name: Install Chromium for isolated UI regressions
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile UI with synthetic API responses
        run: npm run test:ui
