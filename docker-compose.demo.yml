services:
  postgres-demo:
    image: postgres:17-alpine
    container_name: lumi-demo-postgres
    ports: ["127.0.0.1:55434:5432"]
    environment:
      POSTGRES_USER: lumi_demo
      POSTGRES_PASSWORD: lumi_demo_local_only
      POSTGRES_DB: lumi_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi_demo -d lumi_demo"]
      interval: 3s
      timeout: 3s
      retries: 15
